      - name: The UI's types, lint, format, unit tests and build
        # The first half of the UI gates, same commands as in the single job.
        shell: bash
        run: ./scripts/check.sh ui-unit 2>&1 | tee "$RUNNER_TEMP/ui-unit.log"

