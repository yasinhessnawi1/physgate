name: check

on:
  push:
  pull_request:

# The job reads the repository and writes nothing. Naming that here replaces
# whatever the repository default happens to be, which on a public repository
# is the difference between a compromised action reading the code and one that
# can also push to it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The Python suite, then the operator UI's gates, browser tests included. A
    # ceiling well above the observed time still stops a hung runner from burning
    # an hour before anyone looks.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact version rather than a major. This action publishes
        # no floating major ref above v7 — v8, v9 and v10 do not resolve as
        # refs at all — so a major pin here would simply fail to check out.
        # Verified against the provider on the day this was written; the cost
        # is that the bump is manual and deliberate.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # Left unpinned, this installs whatever is newest on the day. The
          # tools that decide pass or fail are pinned by the lockfile and so
          # are identical either way, but the thing that builds the
          # environment they run in was not pinned at all, which is an odd gap
          # in a repository whose point is that a green run here and a green
          # run elsewhere mean the same thing.
          #
          # This exact version is the one that has actually been observed
          # green on these gates on this runner. The developer machine is
          # still on an older one, so this records the difference rather than
          # removing it; removing it means upgrading there and re-taking the
          # environment measurements, which is deliberate work and not this
          # change. When that happens the number belongs in the project file
          # as a required version, where one entry constrains both sides and
          # fails closed instead of being a note.
          version: "0.12.17"
          enable-cache: true

      - name: Create the environment from the lockfile
        # --frozen fails when the lockfile has drifted from the project file,
        # instead of quietly resolving something no one has checked. The Python
        # version comes from the pin file in the repository root.
        run: uv sync --frozen

      - name: Install Node
        # The operator UI's toolchain. Exact tag, like every action pin here, and
        # the Node version the UI's package file names.
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.2"

      - name: Enable the pinned pnpm
        # Corepack ships with Node and installs exactly the pnpm the UI's package
        # file names, version and sha512 both; no further action is needed.
        run: corepack enable

      - name: Install the UI's dependencies from the lockfile
        # --frozen-lockfile fails on any drift from the lockfile. No dependency's
        # install script runs: the UI's package-manager settings refuse a package
        # that needs one, and --ignore-scripts says so here as well.
        working-directory: ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the browser the UI's tests drive
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests, types, lint
        # This is the whole job on purpose. The same script is what runs
        # locally, so "green on my machine" and "green here" cannot come apart.
        run: ./scripts/check.sh
