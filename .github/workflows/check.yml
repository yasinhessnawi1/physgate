          enable-cache: true

      - name: Create the environment from the lockfile
        # --frozen fails when the lockfile has drifted from the project file,
        # instead of quietly resolving something no one has checked. The Python
        # version comes from the pin file in the repository root.
        run: uv sync --frozen

      - name: Install zsh
        # The splitter's tests read each word as every installed shell does, zsh
        # among them, which the runner image does not carry. The reaper's tests no
        # longer need it: off macOS its command shell is bash, or sh.
        run: sudo apt-get install -y --no-install-recommends zsh

      - name: Install Node
        # The operator UI's toolchain. Exact tag, like every action pin here, and
        # the Node version the UI's package file names.
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.2"

      - name: Enable the pinned pnpm
        # Corepack ships with Node and installs exactly the pnpm the UI's package
        # file names, version and sha512 both; no further action is needed.
        run: corepack enable

      - name: Install the UI's dependencies from the lockfile
        # --frozen-lockfile fails on any drift from the lockfile. No dependency's
        # install script runs: the UI's package-manager settings refuse a package
        # that needs one, and --ignore-scripts says so here as well.
        working-directory: ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the browser the UI's tests drive
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Scoring tests, in the evaluation environment
        # tests/scoring is outside the default collection (norecursedirs); the three legs together
        # hold every file of it, once.
        env:
          PHYSGATE_SCORING_SHARD: ${{ matrix.shard }}
        shell: bash
        run: ./scripts/check.sh scoring 2>&1 | tee "$RUNNER_TEMP/scoring.log"

      - name: Test count and wall time, to the job summary
        if: always()
        run: ./scripts/ci-job-summary.sh "scoring ${{ matrix.shard }}" "$JOB_START" "$RUNNER_TEMP/scoring.log"

  static:
    name: static
    runs-on: ubuntu-latest
    # Measured under a minute for types, lint and format together, setup included; the ceiling allows a cold cache.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Start the job's clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install uv
