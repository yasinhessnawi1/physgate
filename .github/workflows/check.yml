name: check

on:
  push:
  pull_request:

# The job reads the repository and writes nothing. Naming that here replaces
# whatever the repository default happens to be, which on a public repository
# is the difference between a compromised action reading the code and one that
# can also push to it.
permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    # Measured about 6 min for the tests step and about 1 min of setup; the ceiling is over three times that, so a hung runner still stops.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Start the job's clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install uv
        # Pinned to an exact version rather than a major. This action publishes
        # no floating major ref above v7 — v8, v9 and v10 do not resolve as
        # refs at all — so a major pin here would simply fail to check out.
        # Verified against the provider on the day this was written; the cost
        # is that the bump is manual and deliberate.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # Left unpinned, this installs whatever is newest on the day. The
          # tools that decide pass or fail are pinned by the lockfile and so
          # are identical either way, but the thing that builds the
          # environment they run in was not pinned at all, which is an odd gap
          # in a repository whose point is that a green run here and a green
          # run elsewhere mean the same thing.
          #
          # This exact version is the one that has actually been observed
          # green on these gates on this runner. The developer machine is
          # still on an older one, so this records the difference rather than
          # removing it; removing it means upgrading there and re-taking the
          # environment measurements, which is deliberate work and not this
          # change. When that happens the number belongs in the project file
          # as a required version, where one entry constrains both sides and
          # fails closed instead of being a note.
          version: "0.12.17"
          enable-cache: true

      - name: Create the environment from the lockfile
        # --frozen fails when the lockfile has drifted from the project file,
        # instead of quietly resolving something no one has checked. The Python
        # version comes from the pin file in the repository root.
        run: uv sync --frozen

      - name: Install zsh
        # The splitter's tests read each word as every installed shell does, zsh
        # among them, which the runner image does not carry. The reaper's tests no
        # longer need it: off macOS its command shell is bash, or sh.
        run: sudo apt-get install -y --no-install-recommends zsh

      - name: Install Node
        # The operator UI's toolchain. Exact tag, like every action pin here, and
        # the Node version the UI's package file names.
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.2"

      - name: Enable the pinned pnpm
        # Corepack ships with Node and installs exactly the pnpm the UI's package
        # file names, version and sha512 both; no further action is needed.
        run: corepack enable

      - name: Install the UI's dependencies from the lockfile
        # --frozen-lockfile fails on any drift from the lockfile. No dependency's
        # install script runs: the UI's package-manager settings refuse a package
        # that needs one, and --ignore-scripts says so here as well.
        working-directory: ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the browser the UI's tests drive
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Python tests
        # Every test the default selection collects, in parallel, exactly as the single job ran them,
        # but the ablation matrix, which the ablation-matrix job runs.
        shell: bash
        run: ./scripts/check.sh tests 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Test count and wall time, to the job summary
        if: always()
        run: ./scripts/ci-job-summary.sh "tests" "$JOB_START" "$RUNNER_TEMP/tests.log"

  ablation-matrix:
    name: ablation-matrix
    runs-on: ubuntu-latest
    # Every combination of the ablation switches, run through the command and, where admitted,
    # the real loop on real git: a job of its own so neither it nor the tests job (which leaves
    # this file out) runs near its ceiling. Measured about 4 min on four local workers.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the job's clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install uv
        # The same exact pin as every other job here, for the same reason.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Create the environment from the lockfile
        run: uv sync --frozen

      - name: The ablation matrix
        shell: bash
        run: ./scripts/check.sh matrix 2>&1 | tee "$RUNNER_TEMP/matrix.log"

      - name: Test count and wall time, to the job summary
        if: always()
        run: ./scripts/ci-job-summary.sh "ablation-matrix" "$JOB_START" "$RUNNER_TEMP/matrix.log"

  scoring:
    name: scoring (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The scoring tests took between 11 and 18 min on one runner, on identical code, so they run
    # in three shards of whole files (scripts/scoring_shard.py deals them and the static job and
    # each leg prove the deal complete). One leg failing does not stop the others from reporting.
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/3", "1/3", "2/3"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the job's clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install uv
        # Pinned to an exact version rather than a major. This action publishes
        # no floating major ref above v7 — v8, v9 and v10 do not resolve as
        # refs at all — so a major pin here would simply fail to check out.
        # Verified against the provider on the day this was written; the cost
        # is that the bump is manual and deliberate.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # Left unpinned, this installs whatever is newest on the day. The
          # tools that decide pass or fail are pinned by the lockfile and so
          # are identical either way, but the thing that builds the
          # environment they run in was not pinned at all, which is an odd gap
          # in a repository whose point is that a green run here and a green
          # run elsewhere mean the same thing.
          #
          # This exact version is the one that has actually been observed
          # green on these gates on this runner. The developer machine is
          # still on an older one, so this records the difference rather than
          # removing it; removing it means upgrading there and re-taking the
          # environment measurements, which is deliberate work and not this
          # change. When that happens the number belongs in the project file
          # as a required version, where one entry constrains both sides and
          # fails closed instead of being a note.
