        run: ./scripts/ci-job-summary.sh "ui-unit" "$JOB_START" "$RUNNER_TEMP/ui-unit.log"

  ui-browser:
    name: ui-browser
    runs-on: ubuntu-latest
    # Measured about 5.5 min for the browser tests and about 1 min of setup; the ceiling is more than twice that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the job's clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install uv
        # Pinned to an exact version rather than a major. This action publishes
