  check:
    # The name branch protection requires. It passes only when every job above succeeded:
    # a failed, cancelled or skipped job fails it, so no job can drop out unseen.
    name: check
    if: always()
    needs: [tests, scoring, static, ui-unit, ui-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          TESTS: ${{ needs.tests.result }}
          SCORING: ${{ needs.scoring.result }}
          STATIC: ${{ needs.static.result }}
          UI_UNIT: ${{ needs.ui-unit.result }}
          UI_BROWSER: ${{ needs.ui-browser.result }}
        run: |
          echo "tests=$TESTS scoring=$SCORING static=$STATIC ui-unit=$UI_UNIT ui-browser=$UI_BROWSER"
          for result in "$TESTS" "$SCORING" "$STATIC" "$UI_UNIT" "$UI_BROWSER"; do
            [ "$result" = success ] || { echo "a job did not succeed"; exit 1; }
          done
