          enable-cache: true

      - name: Create the environment from the lockfile
        # --frozen fails when the lockfile has drifted from the project file,
        # instead of quietly resolving something no one has checked. The Python
        # version comes from the pin file in the repository root.
        run: uv sync --frozen

      - name: Types, lint and format
        # The same gates, same commands, as in the single job.
        shell: bash
        run: ./scripts/check.sh types lint 2>&1 | tee "$RUNNER_TEMP/static.log"

      - name: The scoring shards are a complete partition
        # Fails if any scoring test file is in no shard or in two. The count is the number of
        # legs in the scoring job's matrix; each leg runs the same proof for its own count.
        run: uv run python scripts/scoring_shard.py VERIFY 3

      - name: Test count and wall time, to the job summary
        if: always()
        run: ./scripts/ci-job-summary.sh "static""$JOB_START" "$RUNNER_TEMP/static.log"

  ui-unit:
    name: ui-unit
    runs-on: ubuntu-latest
    # Measured about 45 s for the UI types, lint, format, unit tests and build, and about 1 min of setup.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Start the job's clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install uv
        # Pinned to an exact version rather than a major. This action publishes
