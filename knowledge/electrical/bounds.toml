# Magnitude bounds for the electrical domain, read by the physics gate's
# magnitude check. Every range carries its source, the date it was read and a
# note on what the range is and is not; a range without them does not load.
# Changing a range is a change to what the gate accepts, and is recorded as one.
# Relocated from inside the gate's own directory to sit beside the domain's
# other curated content; the ranges and their sources are unchanged by the move.

[meta]
domain = "electrical"
curated_by = "the physics gate's own build, its ranges reviewed against makers' data sheets on 18.10.2026; not yet reviewed through the knowledge layer's promotion step"

# A stall current has no range here. The span of one maker's hobby gearmotors, which stood
# here before, refused motors outside it that are legitimate (a coreless micro motor stalls
# at about 0.1 A, a robot-competition motor at over 100 A), and no span over every motor is
# narrow enough to tell anything. A stall current is judged instead by the relation that
# holds it to its supply's current limit.

[[range]]
quantity = "sample_rate"
low = 0.78
high = 32000
unit = "Hz"
class = "MEMS inertial measurement unit: a gyroscope's or accelerometer's output data rate"
source = """The lowest and highest output data rates of six MEMS IMU makers' data sheets: \
Bosch BMI270 (BST-BMI270-DS000-08, rev 1.6, March 2026): accelerometer 0.78 Hz in low-power \
mode, the lowest; TDK InvenSense ICM-42688-P (DS-000347 rev 1.9, 12.11.2024, tables 1 and \
2): gyroscope and accelerometer up to 32 kHz, the highest. Inside them: InvenSense \
MPU-6000/6050 (register map RM-MPU-6000A-00 rev 4.0, register 25, and product specification \
PS-MPU-6000A-00 rev 3.1, section 6.6): 3.9 Hz to 8 kHz; ST LSM6DS33 (DocID027423 rev 4): \
13 Hz to 6.66 kHz; ST LSM6DSO (DS12140 rev 2): 1.6 Hz to 6.66 kHz; Bosch BMI088 \
(BST-BMI088-DS000-19 rev 1.9): 12.5 Hz to 2 kHz"""
retrieved = 2026-10-18
note = """Every rate any of these parts can be set to, across makers, not one part's register: \
outside it no MEMS IMU of these makers samples. It is a range for an inertial sensor's \
rate, the one sampled device the stand-in class's electrical nodes declare; it is not a \
range for a control or firmware loop's rate, and it does not hold an electrical converter \
sampling faster (an analogue-to-digital converter), whose rate is not this class's. It \
replaces the single-part MPU-6000/6050 span (3.90625 Hz to 8 kHz), which refused other \
makers' legitimate rates."""
