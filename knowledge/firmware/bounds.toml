# Magnitude bounds for the firmware domain, read by the physics gate's magnitude check.
# Every range carries its source, the date it was read and a note on what the range is and
# is not; a range without them does not load. Changing a range is a change to what the gate
# accepts, and is recorded as one.
#
# Firmware configures the inertial sensor and reads it, so its output data rate is written
# in firmware's nodes as often as in electrical's. The range is the electrical table's
# (the same six data sheets, confirmed 19.10.2026), held here under the same name so a
# firmware node is judged as an electrical one is (D-A2-38, 03.11.2026).

[meta]
domain = "firmware"
curated_by = "the physics gate's own build: the electrical table's output_data_rate range, its sources unchanged, copied 03.11.2026; not yet reviewed through the knowledge layer's promotion step"

[[range]]
quantity = "output_data_rate"
low = 0.78
high = 32000
unit = "Hz"
class = "MEMS inertial measurement unit: a gyroscope's or accelerometer's output data rate"
source = """The lowest and highest output data rates of six MEMS IMU makers' data sheets, each \
fetched and read on 19.10.2026: Bosch BMI270 (BST-BMI270-DS000-08, revision 1.6, March 2026): \
accelerometer 0.78 Hz in low-power mode, the lowest; TDK InvenSense ICM-42688-P (DS-000347; \
TDK lists version 1.8, 27.07.2023, as current; tables 1 and 2 read in revision 1.6, 20.06.2021): \
gyroscope 12.5 Hz to 32 kHz and accelerometer 1.5625 Hz to 32 kHz, the highest. Inside them: \
InvenSense MPU-6000/6050 (register map RM-MPU-6000A-00 revision 4.0, 09.03.2012, register 25, \
and product specification PS-MPU-6000A-00 revision 3.4, 19.08.2013, section 6.6): 3.9 Hz to \
8 kHz; ST LSM6DS33 (DocID027423 rev 4, October 2015): accelerometer 13 Hz to 6.66 kHz, \
gyroscope 13 Hz to 1.666 kHz; ST LSM6DSO (DS12140 rev 3, June 2024): 1.6 Hz to 6.66 kHz; \
Bosch BMI088 (BST-BMI088-DS000-19, revision 1.9, January 2024): accelerometer 12.5 Hz to \
1.6 kHz, gyroscope 100 Hz to 2 kHz"""
retrieved = 2026-10-18
confirmed = 2026-10-19
note = """The electrical sample_rate range, its figures and sources unchanged, held under the \
inertial sensor's own name (D-A2-38, 03.11.2026): every output data rate any of these parts \
can be set to, across makers. The name is an inertial sensor's output data rate only; it is \
not a control or firmware loop's rate, and a converter's sampling rate is not written under \
it."""
