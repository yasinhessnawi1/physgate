# Law card: rate_throughput_output_data_rate, rate <= throughput against an inertial sensor's
# output data rate. Drafted from the literature; the adversarial review is added below the page
# by the reviewer, never by the drafter.

[card]
format = 1
drafted_by = "claude-opus-5-5"

[law]
id = "rate_throughput_output_data_rate"
statement = "a consumer updated once per delivered sample updates no faster than the output data rate of the sensor its edge names"
expression = "U <= R"
pattern = "edge"
anchor = "U"
tolerance = "inequality"
overlaps = "none"
idealisation = "a single-rate consumer that takes exactly one new sample from the named sensor per update (read, compute, output, once per period); a multi-rate loop that updates on predictions between samples, interpolates, or reuses a held sample is a correct design this law refuses"
literals = []
requires = []
unless = []

[law.symbols]
U = { name = "update_rate", place = "self" }
R = { name = "output_data_rate", place = "target" }

[law.source]
kind = "textbook"
title = "Advanced PID Control (K. J. Åström, T. Hägglund)"
edition = "ISA, 2006"
section = "13.3 Computer Implementations, Sampling, pp. 412-413"
read = 2026-11-05
reading = "in full"

[[law.example]]
outcome = "pass"
source = "ST LSM6DS33 data sheet, DocID027423 Rev 4 (October 2015), Table 44 Accelerometer ODR register setting: ODR 104 Hz; the consumer loop runs at 52 Hz, the table's next lower ODR step"
values = { U = { value = 52, unit = "Hz" }, R = { value = 104, unit = "Hz" } }

[[law.example]]
outcome = "fail"
source = "the same Table 44, ODR 104 Hz; the consumer loop runs at 208 Hz, the table's next higher ODR step, while the sensor is still set to 104 Hz"
values = { U = { value = 208, unit = "Hz" }, R = { value = 104, unit = "Hz" } }

[page]
text = """
WHAT IT SAYS
A loop that uses one new sensor reading each time it updates cannot update more often than the
sensor delivers readings. On a consumer node whose constrains edge names an inertial sensor:
update_rate <= the sensor's output_data_rate. Inequality, no allowance. It enters the table at
status warn and is meant to stay there: whether a loop really takes one new sample per update
is a judgement about the design, not something the numbers show.

HOW IT BINDS (edge pattern)
The anchor is update_rate on the consumer. For each node its constrains edges name that
declares output_data_rate, one instance forms. An edge into an interface node, or into a node
not in the graph, is unjudged and says so. If no named node declares output_data_rate, the
consumer shows one unjudged instance naming the missing name. A twin card does the same
against sample_rate (rate_throughput_sample_rate); the two are one law split by the name of the
producer's rate, because a law reads exact names only.

WHAT THE NAMES MEAN (the catalogue's definitions)
- update_rate: "the rate at which a control or firmware loop updates; not an inertial sensor's
  output data rate".
- output_data_rate: "the rate at which an inertial sensor (a gyroscope, an accelerometer)
  delivers samples, as its data sheet sets it; not a control or firmware loop's rate".

WHERE IT DOES NOT HOLD
- Multi-rate designs: a loop that predicts between samples (a Kalman filter's time update), a
  loop that interpolates, or one that deliberately reuses the last sample. These update faster
  than the sensor and are correct; the law refuses them. That is why it is warn only.
- A consumer that fuses several sensors updates at the rate of whichever it waits on; the law
  holds it to each named sensor separately, which over-refuses when it waits on the fastest.
- An edge that names the sensor for some other reason (a mount, a bus) still forms an instance.

SOURCE (read 05.11.2026, primary text of §13.3, pp. 412-413)
Åström and Hägglund, Advanced PID Control (ISA, 2006), §13.3 Computer Implementations,
"Sampling": "When the controller is implemented in a computer, the analog inputs are read, and
the outputs are set with a certain sampling period." The ideal sequence of operation it gives
is: wait for clock interrupt, read analog input, compute control signal, set analog output,
update controller variables, go to 1. One read per update is that sequence. The inequality
follows by counting (each update takes one new sample; the sensor delivers R samples a second,
so there are at most R updates a second); the book does not state the inequality in these
words. I read the chapter from a copy hosted on an NTNU staff page.

WORKED EXAMPLES (ST LSM6DS33, DocID027423 Rev 4, Table 44, accelerometer ODR 104 Hz)
- pass: loop at 52 Hz (the table's next lower ODR step). 52 Hz <= 104 Hz.
- fail: loop at 208 Hz (the table's next higher step) with the sensor left at 104 Hz.

REACH (how little it covers; do not read more into it)
- R-LAW-01 names 2 L flaws for rate <= throughput (Appendix A): one "a consumer updated once per
  delivered sample ...", one "a filter updated on every delivered sample ...". Which producer
  name each used is not in what I read, so this card reaches at most 2 by name, and the two rate
  cards together at most 2.
- update_rate, output_data_rate and sample_rate became exact catalogue names only recently. The
  library's reach research found that this first group of laws forms almost no complete
  instance on any design the builders may read.
- False-positive record: none. f_est <= f_drv blocked no clean twin. The judgement risk is the
  multi-rate design above, which the record may not contain.
- Overlap: none. No relation the checks form reads update_rate or output_data_rate.
"""
