# Law card: electrical_power. Drafted from the literature; the adversarial review is added
# below the page by the reviewer, never by the drafter.

[card]
format = 1
drafted_by = "claude-opus-5-5"

[law]
id = "electrical_power"
statement = "the power a node draws from a DC supply is its supply voltage times the current it draws"
expression = "P == V * I"
pattern = "node"
anchor = "P"
tolerance = "rounding"
overlaps = "none"
idealisation = "a DC supply and a steady draw, all three values at the same terminals of the same node: with ripple, PWM or a varying load the product of the averages is not the average power, and a node whose power_draw is taken on a different rail from its supply_voltage (a regulator's input against its output) is not this law"
literals = []
requires = []
unless = []

[law.symbols]
P = { name = "power_draw", place = "self" }
V = { name = "supply_voltage", place = "self" }
I = { name = "current_draw", place = "self" }

[law.source]
kind = "textbook"
title = "University Physics Volume 2 (S. J. Ling, J. Sanny, W. Moebs; OpenStax)"
edition = "OpenStax, 2016, web edition"
section = "9.5 Electrical Energy and Power, Electric Power, equation 9.12"
read = 2026-11-05
reading = "in full"

[[law.example]]
outcome = "pass"
source = "TI ADS1115 data sheet, SBAS444E (revised December 2024), §5.5 Electrical Characteristics, at VDD = 3.3 V: supply current IVDD operating, typical 150 µA; power dissipation PD at VDD = 3.3 V, typical 0.5 mW"
values = { P = { value = 0.5, unit = "mW" }, V = { value = 3.3, unit = "V" }, I = { value = 0.15, unit = "mA" } }

[[law.example]]
outcome = "fail"
source = "the same table, with the power dissipation of its VDD = 5.0 V row, typical 0.9 mW, written beside the 3.3 V supply and its 150 µA"
values = { P = { value = 0.9, unit = "mW" }, V = { value = 3.3, unit = "V" }, I = { value = 0.15, unit = "mA" } }

[page]
text = """
WHAT IT SAYS
On one node fed from a DC supply, the electrical power it draws is the supply voltage times
the current it draws: power_draw == supply_voltage x current_draw, within the rounding of the
three numbers as written (equality, rounding class; the product's rounding is propagated, so
the allowance is about 1.5 % of the power). It enters the table at status warn, as every law
does.

HOW IT BINDS (node pattern)
An instance forms at every node that declares power_draw. It is judged only where the same
node also declares supply_voltage and current_draw; otherwise it is unjudged, naming what is
missing. It never reads a neighbour's values.

WHERE IT DOES NOT HOLD
- AC, ripple, PWM or a load that varies: P = V I holds instant by instant, but the product of
  an average voltage and an average current is not the average power.
- Values on different terminals: a regulator's power_draw taken at its input beside the
  voltage of its output, or a motor driver's logic supply beside its motor supply.
- The at-stall heat form (all the electrical input becomes heat in a stalled motor) needs a
  name for stall heat that the catalogue lacks; it is not this law.

SOURCE (read 05.11.2026, primary text)
OpenStax, University Physics Volume 2, §9.5 Electrical Energy and Power, subsection "Electric
Power": "The electric power gained or lost by any device has the form P = IV" (equation 9.12),
and "The power supplied from the battery is equal to current times the voltage, P = IV." The
section derives it for a steady current; it does not itself state the DC-only restriction
above, which is mine, from the reading of averages.

WORKED EXAMPLES (TI ADS1115 data sheet SBAS444E, §5.5, at VDD = 3.3 V)
- pass: V = 3.3 V, I = 150 µA, P = 0.5 mW (the data sheet's own PD at 3.3 V). 3.3 x 0.150 =
  0.495 mW; the 0.005 mW miss is inside the allowance (about 0.0075 mW).
- fail: same V and I, P = 0.9 mW, the data sheet's PD for its 5.0 V row written on the wrong
  row. Miss 0.405 mW.

REACH (how little it covers; do not read more into it)
- R-LAW-01 names 3 L flaws in this group (Appendix A): 2 named "electrical power P = V*I" and
  1 named "energy conservation at stall ... P = V*I", the heat form this law does not judge.
  So it can reach at most 2 by name, before any overlap with what the existing checks catch.
- supply_voltage and current_draw sit in no relation today, so plans have had no reason to
  write all three names on one node. The library's reach research found that this first group
  of laws forms almost no complete instance on any design the builders may read; this law is
  one of the reasons that is so, since it needs all three on the same node.
- False-positive record: none. P == V * I, P_s == V_imu * I_imu, Q == V * I and
  Q_stall == V * I_stall blocked no clean twin.
- Overlap: none. power_draw is also read by the power budget relations, but those compare a
  sum of draws with a supply; they do not judge this product.
"""

[review]
by = "claude-sonnet-5-5"
verdict = "reject"
findings = """
Review of electrical_power, 05.11.2026 (the card format has no date field, so the date is here). Reject; three changes are named in items 1 to 3, and the rest was checked and holds.
1. MUST CHANGE, a correct design is refused. The law forms at every node with power_draw and has no unless. A converter or regulator node (it declares power_supply, as the supply_covered relation reads it) writes power_draw as what it draws from upstream, while supply_voltage in a workload is the voltage it supplies and current_draw may be at either terminal. A 12 V to 3.3 V buck stage with supply_voltage 3.3 V, current_draw 0.4 A at its 12 V input and power_draw 4.8 W (input) is correct and is refused (3.3 V times 0.4 A is 1.32 W; the input power is 12 V times 0.4 A). The card names this case in its idealisation and does nothing about it. Add unless { name = "power_supply", place = "self" } with that reason. Consider output_power on self too (a stage written with its own input and output powers).
2. MUST CHANGE, the idealisation is wrong in one place. It says that with PWM the product of the averages is not the average power. On a constant DC rail it is: mean of V times i(t) is V times mean(i). The law fails only where V itself moves with the draw (sag, ripple), or the three values are on different rails or are different statistics. The same sentence sits in WHERE IT DOES NOT HOLD. A person approving the page would be misled about where it fails.
3. MUST CHANGE, say the statistic. The catalogue gives power_draw and current_draw no definition (source: named for the physics gate's checks), so a plan can write a typical power with a maximum current. The card's own data sheet does it: ADS1115 SBAS444E section 5.5 gives IVDD operating typ 150 uA, max 200 uA (300 uA over temperature) and PD typ 0.5 mW at 3.3 V; 3.3 V times 200 uA is 0.66 mW, which this law refuses against the sheet's own 0.5 mW. State in the idealisation and the reach that all three must be the same statistic (typical with typical) at one operating point, and that this is why it stays at warn.
4. Rounding class. The gate takes three significant figures. Data sheets write one or two. The pass example passes only by a hair (miss 0.005 mW, allowance 0.0075 mW). A correct design from a 2-figure sheet can miss by more than the allowance. No change asked; it is a reason for warn, and worth one sentence in the reach.
5. Source holds. OpenStax University Physics Vol. 2, section 9.5, equation 9.12 "The electric power gained or lost by any device has the form P = IV" and "The power supplied from the battery is equal to current times the voltage, P = IV" are verbatim. The text does not restrict P = IV to DC or steady current, so the card is right that the DC restriction is its own. A textbook, not a data sheet.
6. Names hold: power_draw (power), supply_voltage (voltage), current_draw (current) are exact catalogue names, none carries the radian or an absolute temperature. Form holds: no integer literals, each side one monomial, equality in the rounding class, overlaps none is right (no relation reads this product). I loaded the row and ran both examples through the evaluator: pass residual 5e-6 W against allowance 7.46e-6 W; fail residual 4.05e-4 W against 9.46e-6 W.
7. Examples hold against the sheet (TI ADS1115 SBAS444E, revised December 2024): PD 0.5 mW at 3.3 V, 0.9 mW at 5.0 V, IVDD operating typ 150 uA. The fail example fails for the right reason (the 5.0 V row beside the 3.3 V pair). One text fix: the 150 uA is specified at VDD 3.3 V, 8 SPS, 25 C, and the sheet gives no operating current at 5.0 V; say so.
8. Reach is stated plainly and matches the group (3 flaws, 2 by name).
"""
