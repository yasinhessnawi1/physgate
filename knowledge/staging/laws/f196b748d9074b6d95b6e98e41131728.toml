# Law card: stall_current_at_stall_voltage. Drafted from the literature; the adversarial review is
# added below the page by the reviewer, never by the drafter.

[card]
format = 1
drafted_by = "claude-opus-5-5"

[law]
id = "stall_current_at_stall_voltage"
statement = "a DC motor's stall current, at the voltage it is stated at, is no less than its data sheet's stall current scaled by Ohm's law from the rated voltage to that voltage"
expression = "I * Vr >= Ir * Vs"
pattern = "node"
anchor = "Ir"
tolerance = "inequality"
overlaps = "none"
idealisation = "a stalled brushed DC motor has no back-EMF, so its current is the average voltage across its winding over a fixed winding resistance, proportional to that voltage; the data sheet's pair (rated_stall_current at rated_voltage, on the same node) fixes the resistance as rated_voltage / rated_stall_current, and stall_current is taken at stall_voltage, the true average across the winding, with the winding at the data sheet's temperature and nothing regulating the current. A stall_current computed from a smaller resistance passes; a correct stall below the scaling is refused: a winding taken hot, a current-regulating (chopping) driver, which no catalogue name marks yet, or a resistance larger than the data sheet's ratio"
literals = []
requires = []
unless = [
  { name = "duty_cycle", place = "self", reason = "a node that declares duty_cycle is driven by PWM at a duty limit, and stall_voltage is then the duty times the supply's top, which is the average across the winding only while the driver brakes in its off time and the current stays continuous (sizing standards section 6); with coast-mode decay the winding's average is lower, so a stall current computed from the actual waveform is correctly below the Ohm scaling of the duty times the supply" },
]

[law.symbols]
I = { name = "stall_current", place = "self" }
Vs = { name = "stall_voltage", place = "self" }
Ir = { name = "rated_stall_current", place = "self" }
Vr = { name = "rated_voltage", place = "self" }

[law.source]
kind = "textbook"
title = "College Physics 2e (P. P. Urone, R. Hinrichs; OpenStax)"
edition = "OpenStax, 2022, web edition"
section = "23.6 Back Emf, Figure 23.24 and the worked current I = V/R = (48.0 V)/(0.400 ohm) = 120 A"
read = 2026-11-07
reading = "in full"

[[law.example]]
outcome = "pass"
source = "Pololu 50:1 Micro Metal Gearmotor HPCB 6V with Extended Motor Shaft (item #3073), key specifications, stall extrapolation at 6 V: 1.5 A. The motor runs at full duty, with no duty limit, from six Energizer NH15 NiMH cells in series (NH15 engineering data sheet: nominal voltage 1.2 volts), 7.2 V; the example takes the pack at its nominal voltage as its top, which changes only the numbers. stall_current = 1.5 A x 7.2 V / 6 V = 1.8 A"
values = { I = { value = 1.8, unit = "A" }, Vs = { value = 7.2, unit = "V" }, Ir = { value = 1.5, unit = "A" }, Vr = { value = 6, unit = "V" } }

[[law.example]]
outcome = "fail"
source = "the same motor and pack, with the data sheet's 1.5 A at 6 V copied under stall_current while stall_voltage is 7.2 V: the stall is not carried to the voltage it is stated at, and is understated by 0.3 A"
values = { I = { value = 1.5, unit = "A" }, Vs = { value = 7.2, unit = "V" }, Ir = { value = 1.5, unit = "A" }, Vr = { value = 6, unit = "V" } }

[page]
text = """
WHAT IT SAYS
Ohm's law at stall, rank 1 of the library (stall_current_at_supply in the spec's table, form
(a) rewritten on the approved names). A stalled brushed DC motor has no back-EMF, so its current
is the voltage across its winding over the winding's resistance. The data sheet gives one stall
point, rated_stall_current at rated_voltage; the node states its own, stall_current at
stall_voltage. The law: stall_current x rated_voltage >= rated_stall_current x stall_voltage,
that is, the node's stall is no smaller than the data sheet's stall scaled to stall_voltage
(inequality, no allowance). It enters at warn.

WHY AN INEQUALITY, AND WHY THIS DIRECTION
- The dangerous error is an understated stall: the data sheet's figure copied unscaled to a
  higher voltage, so check 4 then holds too small a current to the driver's limit. That is what
  the law refuses.
- An equality would also refuse correct designs that reach a larger stall by another route: a
  stall computed from a terminal resistance below rated_voltage / rated_stall_current (a maker's
  stall figure is an extrapolation, not exactly V over the terminal resistance; Pololu calls
  #3073's "theoretical values"). An overstated stall is the conservative side for check 4, so
  it passes.
- Rounding: on an inequality the gate allows nothing. A stall written to fewer figures than the
  product (for example 1.6 A for 1.575 A, rounded up) passes; rounded down (1.5 A for 1.575 A)
  it is refused.

THE NAMES, AS THE OWNER APPROVED THEM
- stall_current: the stall at the largest average voltage the drive can apply (the duty limit
  times the supply's top), with that voltage under stall_voltage on the same node.
- rated_stall_current: the data sheet's stall at rated_voltage, on the same node, written
  beside stall_current, never instead of it.
- So the law compares two points of one motor on one node: the node's operating stall and the
  maker's. No torque or speed is read. The stall pairing note (stall_torque and no_load_speed
  are at the nominal or brief's voltage, stall_current at the largest) does not arise here,
  because this law pairs only currents with the voltages they are stated at.

HOW IT BINDS (node pattern)
An instance forms on every node that declares rated_stall_current. It is judged only where the
node also declares stall_current, stall_voltage and rated_voltage; otherwise it is unchecked,
naming what is missing.

WHERE IT IS EXCUSED
unless duty_cycle on the node. With a duty limit, stall_voltage is by its definition the duty
times the supply's top. That is the winding's true average only while the driver brakes in the
off time (the DRV8838's brake row) and the current stays continuous: sizing standards section 6
says so, citing TI SLVSBA4F section 7.3.1, Table 7-2. With coast-mode decay the current
freewheels against the supply and dies early, so the winding's average, and the stall current,
are lower than the Ohm scaling of D x V. A writer who computed that is right, and this law would
refuse it, so a duty-limited node is not judged. The cost: plans that follow the standards put
their duty limit under duty_cycle, so the Balboa-style design (duty 0.75) is excused. Today no
real plan writes duty_cycle (run 4 writes max_duty, run 2 duty_limit, the practice set
max_duty_cycle), so the excuse fires on none.

WHERE IT DOES NOT HOLD (refused at warn)
- A current-regulating driver. A driver that limits the current at a set level holds the stall
  below V/R: TI's DRV8830 (SLVSAB2G, section 7.3.3 Current Limit) reduces "the PWM duty cycle
  ... to limit the current through the motor" when its sense voltage exceeds 200 mV, naming
  "a DC motor at start-up or with an abnormal mechanical load (stall condition)". No catalogue
  name marks such a driver yet (the chopping-current name was deferred), so a node whose
  stall_current is the regulated current is refused. Not yet recognised; stated, not fixed.
- A hot winding. Copper's resistance rises with temperature, so a stall taken at a hot winding
  is correctly below the data sheet's (taken at the maker's test temperature). Refused.
- A resistance from another source larger than rated_voltage / rated_stall_current. Refused.
- Brush and switch drops are ignored; they only lower the true stall, which is the refused side.

SOURCE (read 07.11.2026, primary text, in full)
Urone and Hinrichs, College Physics 2e (OpenStax, 2022), section 23.6 Back Emf: "Back emf is
zero when the motor is not turning" (Figure 23.24, where "The coil of a DC motor is represented
as a resistor"); "It is zero when the motor is first turned on, meaning that the coil receives
the full driving voltage and the motor draws maximum current when it is on but not turning";
the worked case: the coils "have a 0.400 ohm equivalent resistance and are driven by a 48.0 V
emf. Shortly after being turned on, they draw a current I = V/R = (48.0 V)/(0.400 ohm) =
120 A." The proportion to voltage (the same R at rated_voltage and at stall_voltage) is that
sentence applied twice, which is the card's own step; the scaling itself is also sizing
standards section 5's model ("At another voltage V the stall current is V / R").

WORKED EXAMPLES (Pololu #3073 product page, read 07.11.2026: "6 V ... 0.74 kg.cm (10 oz.in),
1.5 A", stall columns marked "stall extrapolation*"; Energizer NH15 data sheet: nominal 1.2 V)
- pass: rated 1.5 A at 6 V; the motor at full duty on six NH15 cells, 7.2 V; stall_current
  1.8 A. 1.8 x 6 = 10.8 >= 1.5 x 7.2 = 10.8: holds exactly.
- fail: the same, with 1.5 A copied under stall_current. 1.5 x 6 = 9.0 < 10.8. Check 4 would
  then hold 1.5 A, not 1.8 A, to the DRV8838's 1.8 A peak rating, and pass a margin of zero
  as a margin of 0.3 A.

REACH (how little it covers; do not read more into it)
- R-LAW-01 names 11 L flaws for Ohm's law at stall (Appendix A). Many of their relations compare
  a declared draw with the scaled stall, or sum two motors (Kirchhoff); this card judges neither.
  It can reach at most the single-motor scaling relation by name, and how many of the 11 that is
  is for the measurement to say.
- stall_voltage is new and no real plan writes it (the catalogue row says so). Run 4 writes
  rated_stall_current, stall_current and rated_voltage on its sizing node, so it forms an
  instance there, unchecked for the missing stall_voltage. Had it written its 5.4 V (duty 0.75
  x 7.2 V), 1.35 x 6 = 8.1 >= 1.5 x 5.4 = 8.1 would hold, but its max_duty would then be
  duty_cycle and excuse it. On the evidence, this law judges no instance on any real plan, and
  it measures near zero in R-PG-03, whose knowledge tree cannot teach stall_voltage.
- False-positive record: the spec's hazard (six relations of this law blocked all 40 fresh
  twins) came from equality forms that scale a stall already at the applied voltage a second
  time. This form scales only the data sheet's rated pair, so that double scaling cannot occur;
  no audit has measured it yet.
- Overlap: none. Check 4 holds stall_current to a current_limit; this law holds stall_current to
  the rated pair, and reads no limit.
"""

[review]
by = "claude-sonnet-5-5"
verdict = "reject"
findings = """
Adversarial review, 07.11.2026. Verdict: reject. The law refuses correct designs in ordinary cases, not only at the edges, and the card's own reading of its tolerance leaves no way round it.

REFUSES A CORRECT DESIGN (each run through the loader's own evaluate)
- Rounding. The inequality allows nothing, and equality with the exact scaling is the normal case. Rated 1.5 A at 6 V, stall_voltage 6.3 V: the exact scaled stall is 1.575 A. Written 1.58 it passes, written 1.57 (3 figures, rounded down) it is refused, a miss of 0.03 on a correct value. Any written stall that is the scaled value rounded down fails, so roughly half of non-terminating correct values would be refused. The card names this ("rounded down it is refused") and accepts it; for the headline law that is not an edge case. The pass example sits exactly on the boundary (10.8 = 10.8), which hides it.
- Series resistance. A stall computed honestly with the driver in the path is lower than the Ohm scaling of the data sheet's pair. DRV8838 (SLVSBA4F, section 6.5 table, checked): HS+LS rDS(on) 280 mohm typical, 330 mohm maximum. 7.2 V over (4 + 0.28) ohm = 1.68 A against the scaled 1.8 A: refused. A pack's internal resistance does the same. The card dismisses brush and switch drops as "the refused side", but a stall that includes them is a correct figure under the definition (the current at the motor's terminals).
- Hot winding (a stall 1.8 A / 1.23 for a 60 K rise) and a current-regulating driver are refused; the card says so. No name marks either, so no unless can excuse them. These are three independent classes of correct design, none excusable.
The law cannot tell a stall that is low because the writer forgot to scale from one that is low because it is modelled better. That is the whole content of the check and the reason an inequality in this direction cannot be made safe at this tolerance class.

OTHER FINDINGS
- The unless duty_cycle excuse removes every duty-limited design, which is the design the law's definitions are built around; what remains judged is the full-duty case. Reach statement is honest about this and about zero real plans writing stall_voltage. Real interface drivetrain.motor (kind interface) holds rated_stall_current 1.6, stall_current 1.44, rated_voltage 6 and no stall_voltage, so it is unchecked; had it written 5.4 V the pair is exact (8.64 = 8.64), which again sits on the boundary.
- Node-pattern laws are judged on interface nodes (only members and edge laws excuse them). Not a defect of this card alone, but run 4's interface node carries this card's inputs.
- Consistency with the approved definitions: sound. rated_stall_current and stall_voltage are used as defined; the Ohm scaling is the repo's own sizing standards section 5 model (R = V_rated / I_stall, stall at V is V / R), which I checked.
- Source: OpenStax College Physics 2e 23.6, quotes verified verbatim (zero back emf at start, maximum current, I = V/R = 48.0 V / 0.400 ohm = 120 A, Figure 23.24). It supports a stalled winding being a resistor; the proportionality to voltage between two points of one motor, and the duty-average step, are the card's and the standards' own reading, as the card says. Adequate for the physics, not for the claim that a data sheet pair fixes R.
- Examples: Pololu 3073 checked (6 V, 650 RPM, 150 mA, 0.74 kg.cm, 1.5 A, marked stall extrapolation and theoretical values). Pass 1.8 A and fail 1.5 A are right for the right reason. The 7.2 V pack is the nominal, not the top (the definitions use the top); acknowledged on the card.
- Dropped laws: agree with leaving the summed stall forms out.

WHAT WOULD CHANGE THE VERDICT: a form that tolerates modelling and rounding. The model tolerance class (equality within a stated share of the right side) would admit rounding, a driver's rDS(on) and a small thermal rise, at the price of also refusing a conservative overstated stall by more than the share; or the owner may accept the three refusal classes at warn knowingly. As drafted I cannot call it safe.
"""
