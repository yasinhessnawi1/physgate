# Law card: overall_gear_ratio_product. Drafted from the literature; the adversarial review is added
# below the page by the reviewer, never by the drafter.

[card]
format = 1
drafted_by = "claude-opus-5-5"

[law]
id = "overall_gear_ratio_product"
statement = "a drive's overall gear ratio, from the motor shaft to its last output, is the ratio of the gearmotor's built-in gearbox times the ratio of the external stage after it"
expression = "N == G * E"
pattern = "node"
anchor = "N"
tolerance = "rounding"
overlaps = "none"
idealisation = "one drive train on one node: a gearmotor whose built-in gearbox ratio is gear_ratio, followed by exactly one added stage (or one added train written as one figure) whose ratio is external_gear_ratio, and overall_gear_ratio from the armature to the last output of that same train; each ratio is input speed over output speed, above 1 for a reduction; a gear_ratio that already means the whole train, or a second added stage written under another name, is not this law"
literals = []
requires = []
unless = []

[law.symbols]
N = { name = "overall_gear_ratio", place = "self" }
G = { name = "gear_ratio", place = "self" }
E = { name = "external_gear_ratio", place = "self" }

[law.source]
kind = "textbook"
title = "Introduction to Mechanisms (Y. Zhang, S. Finger, S. Behrens; Carnegie Mellon University, course 39-245)"
edition = "web edition, www.cs.cmu.edu/~rapidproto/mechanisms"
section = "Chapter 7 Gears, 7.6 Ordinary Gear Trains, 7.6.1 Velocity Ratio, equations 7-14 to 7-16"
read = 2026-11-07
reading = "in full"

[[law.example]]
outcome = "pass"
source = "Pololu, Balboa 32U4 Balancing Robot User's Guide (pololu.com/docs/0J70), encoders: '50:1 motors (which have gear ratios more accurately specified as 51.45:1) are used along with the plastic gears that give an additional 2.88:1 reduction'; the guide's instruction is to calculate the total gear ratio 'by multiplying their individual gear ratios': 51.45 x 2.88 = 148.176, written 148.2"
values = { N = { value = 148.2, unit = "1" }, G = { value = 51.45, unit = "1" }, E = { value = 2.88, unit = "1" } }

[[law.example]]
outcome = "fail"
source = "the same gearmotor and stage, with the overall ratio taken from the gearmotor's nominal name, 50:1, times 2.88: 144, written beside the exact 51.45:1 (Pololu #3073 product page: 'Exact gear ratio: (32x33x35x38) / (15x14x13x10) ~~ 51.45:1')"
values = { N = { value = 144, unit = "1" }, G = { value = 51.45, unit = "1" }, E = { value = 2.88, unit = "1" } }

[page]
text = """
WHAT IT SAYS
Rank 5, the "overall ratio is the product of the stages" form of gear-train kinematics. In a
compound gear train the speed ratio from the first gear to the last is the product of each mesh's
ratio, because each intermediate shaft's speed is the output of one mesh and the input of the
next. On a node that describes one drive: overall_gear_ratio == gear_ratio x external_gear_ratio,
within the propagated rounding of the three numbers (equality, rounding class). It enters at warn.

THE NAMES AND THEIR CONVENTION
- overall_gear_ratio (approved 07.11): from the motor shaft (the armature) to the last output,
  any built-in gearbox included, the product of every stage's input speed over output speed,
  above 1 for a reduction (the reciprocal of Shigley's train value).
- gear_ratio: "a gear train's ratio, output over input", read by check 3 for torque; for torque,
  output over input is the same number as input speed over output speed for a reduction, so the
  three names agree in convention. Here it must be the built-in gearbox of the motor as bought.
- external_gear_ratio: "an external gear stage's ratio".
The textbook's velocity ratio is the same convention (omega_1 / omega_4, input over output).

HOW IT BINDS (node pattern)
An instance forms on every node that declares overall_gear_ratio; judged where the node also
declares gear_ratio and external_gear_ratio; otherwise unchecked. A node that writes only
gear_ratio (the practice gearbox node, which writes 148.3 under gear_ratio meaning the whole
train) forms no instance, so its double count is not refused here; that is a flaw the practice
convention carries in, read by the catalogue rows, not this card.

WHERE IT DOES NOT HOLD (refused at warn)
- gear_ratio written as the whole train on a node that also writes overall_gear_ratio and
  external_gear_ratio (the practice convention plus the new name): the product counts the
  external stage twice. That is a misnamed value under the approved definitions; refused.
- Two or more added stages with only one under external_gear_ratio and the other under a suffixed
  name (the `_gear_ratio` suffix is read for its kind, never by a law): the product misses a
  stage and a correct overall ratio is refused. external_gear_ratio is "an external gear stage's
  ratio"; a design with two stages should write their product there, and this card says so.
- A train with no built-in gearbox (a bare motor and one stage): gear_ratio is absent, so the
  instance is unchecked, not refused.
- A planetary stage: the textbook derives its ratio another way (section 7.7, by inverting the
  train), but stages in series still multiply, so the law holds as long as the stage's own ratio
  is written under its name.
- No torque, speed or current is read, so the stall pairing note does not arise.

STANDARDS SENTENCE THE LAW NEEDS (added 07.11 at the review's request; K-track, the owner's)
The approved definitions reach the writer only through the standards, and today no standards
text says what gear_ratio and external_gear_ratio hold beside overall_gear_ratio (sizing section
10 lists gear_ratio only; the practice gearbox wrote the whole train under it). Proposed for
sizing standards section 10, beside the overall_gear_ratio sentence: "gear_ratio is the built-in
gearbox of the motor as bought, external_gear_ratio the stages the design adds after it, written
as their product where there are several; overall_gear_ratio is the two multiplied." Until it is
promoted, a writer who follows the practice convention is refused at warn (above).

SOURCE (read 07.11.2026, in full, the equations as the page's images)
Zhang, Finger and Behrens, Introduction to Mechanisms (Carnegie Mellon), chapter 7, section 7.6.1
Velocity Ratio: "the velocity ratio of a pair of gears is the inverse ratio of their number of
teeth"; for the simple train, equation 7-14 for each pair, and "These equations can be combined to
give the velocity ratio of the first gear in the train to the last gear" (7-15: omega_1/omega_4 =
N2 N3 N4 / (N1 N2 N3) = N4/N1); for the compound train of Figure 7-6b, equation 7-16: omega_1 /
omega_4 = (-1)^2 N2 N4 / (N1 N3), the product of the two meshes' ratios. The sign (direction) is
not judged: the catalogue's ratios are magnitudes.

WORKED EXAMPLES (Pololu Balboa 32U4 User's Guide, read 07.11.2026; Pololu #3073 product page,
read 07.11.2026)
- pass: 51.45 x 2.88 = 148.176; written 148.2. Miss 0.024; the loader's propagated allowance
  is 2.23 (about 1.5 %: the gate assumes three significant figures on each number).
- fail: 144 (50 x 2.88, the nominal 50:1) beside the exact 51.45 and 2.88. Miss 4.18, against
  an allowance of 2.21. A ratio off by less than about 1.5 % passes.
A run-4 check (not an example): its sizing node writes overall_gear_ratio 110.2418, gear_ratio
51.446 and external_gear_ratio 2.142857; 51.446 x 2.142857 = 110.2414, a miss of 0.0004,
against an allowance of 1.66. So the one real node that writes all three passes.

REACH (how little it covers; do not read more into it)
- R-LAW-01 names 4 L flaws for gear-train kinematics; 1 of them is named for this form ("overall
  ratio equals the product of the stage ratios"). The others are the speed form and the encoder
  counts form, which this batch does not card (see the drafter's report).
- Real plans: one instance on run 4's sizing node, which passes. The practice set forms none (no
  overall_gear_ratio). So it judges at most a handful of instances, and catches only a ratio that
  is not the product of the two written beside it.
- Overlap: none. Check 3 reads gear_ratio and external_gear_ratio in its torque readings, but
  never their product against an overall ratio.
"""

[review]
by = "claude-sonnet-5-5"
verdict = "accept"
findings = """
Adversarial review, 07.11.2026. Verdict: accept, with three residual refusals the owner should know and one sentence for the standards.

PHYSICS
- Speed ratios of stages in series multiply (each shaft is the output of one mesh and the input of the next), so overall = built-in x added when every ratio is input over output. Efficiency, backlash and planetary internals do not enter a speed ratio. Verified through the loader: 51.45 x 2.88 = 148.176 against 148.2 passes (allowance 2.23); 148 passes; run 4's trio 51.446 x 2.142857 = 110.2414 against 110.242 passes. Run 4's interface node drivetrain.motor holds all three names (51.446, 2.142857, 110.242) and is judged, since node laws are not excused on interface nodes; it passes. The allowance is about 1.5 percent, so only an inconsistency larger than that fails.
- Residual refusals of a design that is correct under the catalogue text: (1) A drive with two or more added stages where only one is under external_gear_ratio and the other under a suffixed name: the catalogue defines external_gear_ratio as an external stage's ratio, singular, so the card's instruction (write the product there) is not in any approved text. (2) A signed overall ratio: the batch rows allow a reversing stage to be signed, and a writer who signs only overall_gear_ratio (for example -148.2 beside 51.45 and 2.88) is refused (checked: residual -296). (3) gear_ratio written as the whole train (the practice node's 148.3) beside external_gear_ratio and a new overall_gear_ratio: refused. I agree with the drafter that the project already reads 148.3 under gear_ratio as the double count, so I do not count it against the card, but gear_ratio's catalogue sentence ("a gear train's ratio") does not say built-in only; the standards sentence should. None of these has an exact-name excuse, which is why I do not ask for one.
- Convention: gear_ratio is defined output over input and overall_gear_ratio input speed over output speed, above 1; for a reduction these are the same number, and check 3's reading calls both output over input, above 1. The card's statement is right.

SOURCES
- CMU course notes (Zhang, Finger, Behrens, chapter 7): I opened the page. It defines velocity ratio as input revolutions over output revolutions, gives the simple train and compound-train equations, and says idler tooth numbers cancel. The equations are images, and it does not say in words that compound ratios multiply; the product follows from combining equations 7-14 and 7-15. Weak but adequate for an elementary identity; a mechanism text (Shigley or Norton) would be better and the owner may want it before block.

EXAMPLES
- Balboa user guide checked: "gear ratios more accurately specified as 51.45:1", "plastic gears that give an additional 2.88:1 reduction", total by multiplying. Pass right. The fail example (144, from the nominal 50:1) fails only because the miss 4.18 exceeds the 2.21 allowance; a 2.8 percent slip, so it is sensitive to the gate's 3-figure assumption. Acceptable.

REACH
- Honest: one real node, passing. The practice set forms none.
- Dropped laws: agree with all three. The speed form on the spec's own record blocked all 20 practice twins (a ratio-convention clash). The encoder-counts form holds only for an encoder on the armature (the wheel-count definition says so), and no catalogue name says where the encoder sits, so it would refuse a correct gearbox-output encoder. The torque bound likewise blocked all 20 practice twins in the spec's table, and check 3 already reads the ratios.
"""
