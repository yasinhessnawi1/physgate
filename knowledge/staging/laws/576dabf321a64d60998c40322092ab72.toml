# Law card: within_rating_current, the current half of "an operating value within its own
# rating". Drafted from the literature; the adversarial review is added below the page by the
# reviewer, never by the drafter.

[card]
format = 1
drafted_by = "claude-opus-5-5"

[law]
id = "within_rating_current"
statement = "a node's operating current is within its own maximum rated current"
expression = "I <= L"
pattern = "node"
anchor = "L"
tolerance = "inequality"
overlaps = "current_limit"
idealisation = "current_draw is the node's own steady operating current and current_limit the maximum output current its data sheet rates, both on the same node; a continuous, pulsed or duty-limited rating, a derated limit, or a current the node chops or regulates below its draw is a different number, and transients above the steady draw are not judged"
literals = []
requires = []
unless = []

[law.symbols]
I = { name = "current_draw", place = "self" }
L = { name = "current_limit", place = "self" }

[law.source]
kind = "standard"
title = "ECSS-Q-ST-30-11C Rev.2, Space product assurance: Derating - EEE components"
edition = "Rev.2, 23 June 2021"
section = "3.2.8 rating (with its note); 5.1 Overview and 5.2 Principles of derating"
read = 2026-11-05
reading = "in full"

[[law.example]]
outcome = "pass"
source = "TI DRV8838 data sheet, SLVSBA4F (revised April 2021), §6.3 Recommended Operating Conditions: IOUT motor peak current, max 1.8 A; the node carries a Pololu 10:1 Micro Metal Gearmotor HPCB 6V (item #3061, product specifications) whose worst-case draw, its stall current at 6 V, is 1.5 A"
values = { I = { value = 1.5, unit = "A" }, L = { value = 1.8, unit = "A" } }

[[law.example]]
outcome = "fail"
source = "the same DRV8838 limit, 1.8 A, with the node carrying a Pololu 4.4:1 Metal Gearmotor 25Dx63L mm HP 6V (item #4801, product specifications) whose stall current at 6 V is 6.0 A"
values = { I = { value = 6.0, unit = "A" }, L = { value = 1.8, unit = "A" } }

[page]
text = """
WHAT IT SAYS
A part's rating is the most its maker guarantees it can take; a design that runs a part above
its own rating is not a design that part supports. On one node: current_draw <= current_limit.
Inequality, no coefficient, no allowance. It enters the table at status warn, as every law does.

THE NAME
The id is within_rating_current, not within_rating, because the voltage half (supply voltage
within an absolute maximum voltage) needs a name, max_voltage, the catalogue does not hold yet.
It will be its own row. rated_voltage is a nominal rating, not an absolute maximum, so running
above it is a design choice and is not refused by anything here.

HOW IT BINDS (node pattern)
The anchor is current_limit: an instance forms at every node that declares a current limit
(drivers and supplies, by the catalogue's definition), and is judged only where the same node
also declares current_draw. I anchored on the limit rather than the draw so that the many
consumer nodes that declare a draw and no rating do not each show as an unjudged instance.

WHAT current_limit MEANS HERE (the catalogue's definition)
"a driver's or supply's maximum output current: the peak output current its datasheet rates
(for example TI DRV8838, SLVSBA4F section 6.3, IOUT motor peak current 1.8 A), not a continuous
rating." So the law compares an operating current with a peak rating; it is a weak bound, and
it says nothing about a current above a continuous rating.

WHERE IT DOES NOT HOLD
- A rating that is not a peak rating: a continuous, pulsed or duty-cycle rating, or a limit
  already derated. Under the wrong number the law refuses a sound design or passes an unsound
  one.
- A node that regulates or chops its current (a current-limiting driver) can be written with a
  draw above its limit that it never actually delivers.
- Transients: inrush and stall spikes above the steady draw are not judged.

SOURCE (read 05.11.2026, primary text, clauses 3, 5.1 and 5.2)
ECSS-Q-ST-30-11C Rev.2 (23 June 2021), §3.2.8 "rating: maximum parameter value specified and
guaranteed by the component manufacturer and component procurement specification. NOTE Rating
is considered as a limit not to be exceeded during operation and constitutes in most cases the
reference for derating." §5.2: "A component operates in a reliable way if its parameter
strength exceeds the parameter stress. The designer should ensure that the stress applied does
not exceed the component parameter strength." The standard asks for more than this law checks
(a derated margin below the rating); the law checks only the rating itself.

WORKED EXAMPLES (TI DRV8838, SLVSBA4F §6.3, IOUT max 1.8 A; Pololu product specifications)
- pass: the node carries a Pololu #3061 gearmotor (stall 1.5 A at 6 V). 1.5 A <= 1.8 A.
- fail: the node carries a Pololu #4801 gearmotor (stall 6.0 A at 6 V). 6.0 A > 1.8 A.
Both draws are the motors' worst-case (stall) currents written as the node's current_draw;
Pololu calls those stall values theoretical extrapolations.

REACH (how little it covers; do not read more into it)
- R-LAW-01 names 4 L flaws in this group (Appendix A), 2 on current and 2 on voltage; this card
  is the current half, so it can reach at most 2 by name. The strict-law reading of R-LAW-01
  drops 3 of the group's 4, so the honest expectation is 1 or 0.
- current_draw sits in no relation today, so few plans write it beside a current_limit. The
  library's reach research found that this first group of laws forms almost no complete
  instance on any design the builders may read.
- False-positive record: low. I_nl <= I_lim blocked no clean twin.
- Overlap: the relation current_limit already holds a stall_current to the same current_limit.
  Where a node declares both a stall current and a draw no larger, that relation implies this
  law; the law adds a catch only where a draw is written and a stall current is not, or the
  draw exceeds the stall.
"""

[review]
by = "claude-sonnet-5-5"
verdict = "reject"
findings = """
Review of within_rating_current, 05.11.2026 (the card format has no date field, so the date is here). Reject; the changes are items 1 and 2, with the text fixes in 3.
1. MUST CHANGE, a correct design is refused. The law forms at every node with current_limit, and a supply or converter node declares current_limit as its output rating while a current_draw written on it may be at its input (power_draw on a supply is what it draws from upstream). A boost stage from a 3.7 V cell to 5 V with a 1 A output limit draws about 1.5 A at its input, a correct design, and this law refuses it. The card's idealisation says "same node" but not "same terminals", and the sibling card electrical_power names the regulator case. Add unless { name = "power_supply", place = "self" } with that reason. The law then reaches drivers, which is where its own examples sit.
2. MUST CHANGE, the idealisation and the examples disagree. The idealisation and the page say current_draw is the node's steady operating current and that stall spikes are not judged. Both worked examples, and the page's last paragraph, write a motor's stall current (a worst case, and a name the catalogue already has, stall_current) as current_draw. The catalogue gives current_draw no definition (source: named for the physics gate's checks). Say which reading the law takes, or say it takes whatever statistic the plan wrote; do not claim steady and then show stall.
3. Text fixes. Pololu item #4801 is "4.4:1 Metal Gearmotor 25Dx63L mm HP 6V with 48 CPR Encoder"; the card drops the encoder. DRV8838 SLVSBA4F section 6.3 gives IOUT as "Motor peak current", max 1.8 A; the same sheet's design example targets 0.8 A rms and its overcurrent trip is 1.9 A min, so a pass here says nothing about a sustained current (the card says "weak bound"; keep that).
4. Source holds for what it is used for. ECSS-Q-ST-30-11C Rev.2 (23 June 2021), clause 3.2.8 "rating" and its NOTE ("Rating is considered as a limit not to be exceeded during operation..."), and 5.2 "The designer should ensure that the stress applied does not exceed the component parameter strength", are verbatim. It is a standard (not a data sheet), written for space EEE components; it supports "stress must stay under the rating", not the choice of a peak rating as the number. The card says the standard asks for more than the law checks.
5. Examples hold: DRV8838 1.8 A; Pololu #3061 stall 1.5 A at 6 V, #4801 stall 6.0 A at 6 V (Pololu calls both theoretical). I loaded the row and ran the examples: 1.5 A passes against 1.8 A, 6.0 A fails; the fail is for the right reason.
6. Names hold: current_draw and current_limit are exact catalogue names of kind current. The row does not restate the relation current_limit (its names are stall_current and current_limit) and overlaps = "current_limit" is a relation the checks form. Form holds: no literals, one monomial a side, inequality with no allowance.
7. Reach is stated plainly: at most 2 of the 4 by name, and the strict reading drops 3 of 4. Keep it.
"""
