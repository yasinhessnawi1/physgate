[package]
name = "physgate-desktop"
version = "0.1.0"
description = "A desktop window around the physgate operator UI, served on loopback by `physgate ui`"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2.13"
tauri-plugin-dialog = "2.6"
# One app per identifier: a second launch hands over to the first and quits, so two
# instances never share (and reap) one folder's server.
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# The macOS Keychain, through Apple's own API: the only place a credential is kept.
security-framework = "3.7"
# The one request the operator may ask for: "Test key". The same client the updater already
# builds with, so nothing new is compiled in.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[features]
# The PHYSGATE_DESKTOP_... switches for trial runs (another home, a stand-in Claude Code, a
# Keychain service of its own, an update accepted without its dialog, a click-through).
# Never in a published build, which reads none of them.
verification = []
# A scripted walk through the onboarding screens, for screenshots. Never in a published build.
walkthrough = ["verification"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The checks build in the dev profile; leaving dependencies without debug information keeps
# that build under half the size, and nothing here is debugged inside a dependency.
[profile.dev.package."*"]
debug = false
