[project]
name = "physgate"
version = "0.0.0"
description = "A deterministic harness for agentic mechatronic design."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  # The physics gate's two tools. Narrow on purpose: the gate's unit rules lean on
  # how this pint line treats the radian (dimensionless, but kept as a unit of its
  # own in root units) and offset temperatures, both measured on 0.26.1.
  "pint>=0.26,<0.27",
  "sympy>=1.14,<1.15",
]

# One command with subcommands: `physgate hooks install` writes a session's
# settings file outside its worktree; `physgate decompose` starts a run from its
# one model call; `physgate queue` lists and resolves the approval queue.
[project.scripts]
physgate = "physgate.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "mypy>=2.3,<3",
  "ruff>=0.16,<0.17",
  "pytest-xdist>=3.8,<4",
]
# The evaluation side's own tools, never the product's: the per-role scorers compute
# closed-loop margins, settling times and errors with python-control. Pinned exactly
# to the versions the public ControlEval benchmark pins (its requirements file), so
# our independent scorer runs on the numerics that benchmark was built with. These
# never reach a role session's hooks, which install runtime dependencies only.
evaluation = [
  "control==0.10.1",
  "numpy==2.1.2",
  "scipy==1.14.1",
]

[build-system]
# Pinned exactly, and this is the one dependency the lockfile does not
# cover. Measured with an empty cache: building this project downloads the
# backend from the network every time, and the lockfile has no entry for
# it. The alternative backend bundled with newer versions of the installer
# is fetched too, and this version does not offer it, so there is no
# mechanism here that avoids the fetch. An exact pin is what is left: the
# input stops being whatever happens to be newest on the day.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
# A cooldown for new dependencies: no version younger than a week is taken
# without a stated need. Set on 26.09.2026, when the physics gate added pint and
# sympy. Of the six packages that brought, only platformdirs had a release
# younger than a week (4.11.12 to 4.12.0, the last one published that same day),
# so it is bounded to the newest release at least a week old, 4.11.11 of
# 19.09.2026. The installer's global cutoff (`exclude-newer`) was measured and
# not used: it also governs the build backend, whose exact pin (published
# 20.09.2026) it then refused, and the oldest installer that reads this file
# (0.6.6) has no per-package form of it. Re-examine this bound whenever a
# dependency is added, and lift it once the week has passed for a newer release.
constraint-dependencies = [
  "platformdirs<=4.11.11",
  # Added on 17.10.2026 with the evaluation group: python-control requires
  # matplotlib, whose dependencies fonttools (4.67.0, 14.10.2026) and pillow
  # (13.0.0, 16.10.2026) had releases younger than a week. Each is bounded to its
  # newest release at least a week old.
  "fonttools<=4.66.1",
  "pillow<=12.3.0",
]
# Both groups install by default, so the checks see the evaluation code's imports.
default-groups = ["dev", "evaluation"]

[tool.hatch.build.targets.wheel]
packages = ["src/physgate"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

# The experiment directories hold this repository's only measured results. The
# code in them is frozen at the state that produced those numbers, it was run
# under its own hand-built environments and in one case under an older Python,
# and reformatting or "fixing" a single line would alter an artefact whose
# entire value is that it has not changed since it was measured.
#
# This is `extend-exclude` and not `exclude` on purpose: `exclude` REPLACES the
# tool's own built-in exclusions instead of adding to them, so it would quietly
# widen what gets linted elsewhere in the tree. Measured, not assumed.
extend-exclude = ["experiments"]

# Without this, a path passed explicitly on the command line overrides the
# exclusion above: `ruff format experiments/...` would reformat 49 frozen files
# and report success. The fence has to hold against an argument, not only
# against a bare `.`, because the argument is how it will actually be crossed.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are named for the behaviour they prove, which is the documentation that
# matters there; a docstring on every test function would restate the name.
"tests/*" = ["D1"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
# The pydantic plugin types every model's constructor from its fields, so a
# wrong field name or a wrong type where a record is built is a type error, not
# a validation error at run time. Without it, a record built through keyword
# arguments is checked by nothing until it runs.
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
# Same reason as the lint exclusion above: frozen measured artefacts.
exclude = ["^experiments/"]

# sympy ships no type information (no marker file and no stubs, checked on
# 1.14.0). The gate imports it in exactly one module, a typed wrapper, and a
# test holds it there, so the untyped values stay inside that one file.
[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

# python-control ships no type information either (no marker file, checked on
# 0.10.1). Only the evaluation side's control scorer imports it.
[[tool.mypy.overrides]]
module = ["control", "control.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# The check scripts' helper, so its tests import it by name as the scripts run it.
pythonpath = ["scripts"]
# An unregistered marker must be a collection error, never a silent skip.
addopts = "--strict-markers -m 'not integration'"
markers = [
  "integration: needs external state, a spawned session or a real tool server",
  "injected: a deliberately wrong artefact, asserted to be refused at the right stage",
]
# Belt and braces. Nothing under the experiment directories matches a
# collection pattern today; this is here for the fourth experiment, not the
# three that exist.
norecursedirs = ["experiments", ".venv", "build", "dist", "node_modules"]
