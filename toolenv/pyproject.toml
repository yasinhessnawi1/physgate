# The tool environment's own project: the libraries a role session computes and builds with.
# It is locked and provisioned apart from the harness (pint changes how it handles units when
# numpy is importable). `exclude-newer` holds the lock to releases at least a week old when it
# was taken; provision.py builds the environment from this lock, copying every file.
[project]
name = "physgate-tool-environment"
version = "0"
requires-python = "==3.12.9"
dependencies = [
  "control==0.10.1",
  "numpy==2.1.2",
  "scipy==1.14.1",
  "mujoco==3.17.0",
  "platformio==6.2.0",
]

# The design roles' libraries: a CAD kernel with its exact wheel named, so the kernel a part is
# built and measured with is a pin of its own and never whatever the library's range admits; a
# finite-element library in pure Python on the numpy and scipy pinned above; and a library that
# writes a schematic from a circuit described in Python.
[dependency-groups]
design = [
  "build123d==0.13.0",
  "cadquery-ocp-novtk==8.0.1.1.0",
  "scikit-fem==12.0.2",
  "skidl==3.0.0",
]

[tool.uv]
# The circuit library asks for a circuit simulator under the GPL; nothing here simulates, the
# library imports without it, and no GPL library is loaded in a session's own process. A marker
# no platform satisfies keeps it out of every environment.
override-dependencies = ["inspice; sys_platform == 'never'"]
# Three of the circuit library's packages publish no wheel, only source, so provisioning builds
# them. Their sources are held by the lock's digests; the build backend, and the one extra build
# requirement a package's setup asks for, are held here to one exact version each.
build-constraint-dependencies = ["setuptools==80.9.0", "pytest-runner==6.0.1"]
package = false
default-groups = ["design"]
exclude-newer = "2026-10-24T00:00:00Z"
